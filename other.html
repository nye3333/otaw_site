    <script>
    (function () {
        var host = document.getElementById('otaw-floating-videos');
        if (!host) return;
        var key = host.getAttribute('data-float-pos-key') || 'otaw_site_float_fig_positions';
        var minStored = parseInt(host.getAttribute('data-float-min-stored-slot') || '1', 10);
        if (!isFinite(minStored) || minStored < 1) minStored = 1;
        var data;
        try {
            data = JSON.parse(localStorage.getItem(key) || 'null');
        } catch (e) { return; }
        if (!data || typeof data !== 'object') return;
        host.querySelectorAll('.float-fig').forEach(function (fig) {
            var id = null;
            fig.classList.forEach(function (c) {
                if (/^fv-\d+$/.test(c)) id = c;
            });
            if (!id || data[id] == null) return;
            var slotNum = parseInt(id.slice(3), 10);
            if (!isFinite(slotNum) || slotNum < minStored) return;
            var p = data[id];
            var left = Number(p.left);
            var top = Number(p.top);
            if (!isFinite(left) || !isFinite(top)) return;
            fig.style.left = left + 'px';
            fig.style.top = top + 'px';
            fig.style.right = 'auto';
        });
        requestAnimationFrame(function () {
            requestAnimationFrame(function () {
                var W = host.clientWidth, H = host.clientHeight;
                host.querySelectorAll('.float-fig').forEach(function (fig) {
                    if (!fig.style.left) return;
                    var nx = parseFloat(fig.style.left), ny = parseFloat(fig.style.top);
                    if (!isFinite(nx) || !isFinite(ny)) return;
                    var fw = fig.offsetWidth || 48, fh = fig.offsetHeight || 48;
                    var maxX = Math.max(0, W - fw), maxY = Math.max(0, H - fh);
                    fig.style.left = Math.max(0, Math.min(nx, maxX)) + 'px';
                    fig.style.top = Math.max(0, Math.min(ny, maxY)) + 'px';
                });
            });
        });
    })();
    </script>
